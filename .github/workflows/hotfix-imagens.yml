# Imagens do HOTFIX 1.113.0-ia-calada — exclusivo do fork da Equilíbrio Informática.
#
# ⚠️ ADAPTAÇÃO DE FORK. Este arquivo NÃO volta para o repositório oficial: o PR
# de contribuição é montado a partir da `main` só com o commit da correção.
#
# O que faz: constrói e publica SOMENTE o app e o worker, SOMENTE linux/amd64,
# SOMENTE com a etiqueta fixa abaixo, em ghcr.io/<dono-do-fork>/. Não publica
# `latest`, `stable`, número semver, nem scheduler/voice-agent. Não faz deploy:
# nenhum passo fala com a VPS, e o único segredo usado é o GITHUB_TOKEN.
#
# Disparo: SOMENTE o push MANUAL de uma tag exata (não há push de branch,
# agenda, PR nem workflow_dispatch). Ex.:
#   git tag -a hotfix-imagens/1.113.0-ia-calada.1 -m "imagens do hotfix" <commit>
#   git push equilibrio hotfix-imagens/1.113.0-ia-calada.1
# O `publish-image.yml` herdado só reage a tags `v*`, então esta tag não o dispara.
#
# Compatibilidade com a v1.113.0: o commit precisa descender do commit da
# release (8d0ba3691), o package.json precisa dizer 1.113.0, e a imagem leva
# APP_VERSION=1.113.0 — é o que a tela de Atualizações e o rollback esperam.
#
# Etiqueta IMUTÁVEL: se ela já existir no GHCR, o job recusa em vez de
# sobrescrever. Correção nova = etiqueta nova (…ia-calada.2) e tag nova.

name: Imagens do hotfix (fork)

on:
  push:
    tags: ["hotfix-imagens/1.113.0-ia-calada.1"]

# Nada por padrão; cada job pede só o que usa.
permissions: {}

concurrency:
  group: hotfix-imagens
  cancel-in-progress: false

env:
  ETIQUETA: 1.113.0-ia-calada.1
  VERSAO_BASE: 1.113.0
  COMMIT_BASE: 8d0ba36914b9dbd00c6bd0852d4adcf160d4d43d
  BRANCH_HOTFIX: hotfix/1.113.0-ia-calada
  REPOSITORIO: equilibrio-informatica/DeskcommCRM
  REGISTRY: ghcr.io

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Procedência — repositório, tag, branch e base v1.113.0
        run: |
          set -euo pipefail
          [ "${GITHUB_REPOSITORY}" = "${REPOSITORIO}" ] || { echo "::error::só roda em ${REPOSITORIO} (rodando em ${GITHUB_REPOSITORY})"; exit 1; }
          [ "${GITHUB_REF}" = "refs/tags/hotfix-imagens/${ETIQUETA}" ] || { echo "::error::ref inesperada: ${GITHUB_REF}"; exit 1; }
          git merge-base --is-ancestor "${COMMIT_BASE}" "${GITHUB_SHA}" || { echo "::error::o commit não descende da v${VERSAO_BASE} (${COMMIT_BASE})"; exit 1; }
          git branch -r --contains "${GITHUB_SHA}" | grep -qxF "  origin/${BRANCH_HOTFIX}" || { echo "::error::o commit não está na branch ${BRANCH_HOTFIX}"; exit 1; }
          versao=$(node -p "require('./package.json').version")
          [ "${versao}" = "${VERSAO_BASE}" ] || { echo "::error::package.json diz ${versao}, esperado ${VERSAO_BASE}"; exit 1; }
          echo "ok: ${GITHUB_SHA} em ${BRANCH_HOTFIX}, sobre v${VERSAO_BASE}"

      - uses: ./.github/actions/preparar-node
        # Passo de composite action não aceita `timeout-minutes` dentro dela.
        timeout-minutes: 5

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm -s typecheck

      - name: Testes da correção
        run: >-
          pnpm vitest run
          tests/unit/bloqueio-ia-atendimento-humano.test.ts
          tests/unit/cron-handoff-devolucao.test.ts
          tests/unit/escalacao-devolucao-automatica.test.ts
          lib/agent-engine/agent/roteiro-no-turno.test.ts
          tests/unit/atraso-humano-nao-afrouxa-o-anti-ban.test.ts
          lib/escalacao/atendimento-manual.test.ts
          tests/unit/messages-handler-silencio-ia-apos-humano.test.ts
          tests/unit/escalacao-retomada.test.ts

  imagens:
    needs: [conferir]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: deskcommcrm
            dockerfile: Dockerfile
            title: DeskcommCRM
          - name: deskcomm-worker
            dockerfile: Dockerfile.worker
            title: DeskcommCRM worker
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: A etiqueta ainda não existe (imutável)
        run: |
          set -uo pipefail
          img="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${{ matrix.name }}:${ETIQUETA}"
          if docker manifest inspect "$img" >/dev/null 2>&1; then
            echo "::error::$img já existe — não sobrescrevo. Use uma etiqueta nova."
            exit 1
          fi
          echo "ok: $img ainda não existe"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push (linux/amd64, etiqueta fixa)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ env.ETIQUETA }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.version=${{ env.ETIQUETA }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            APP_VERSION=${{ env.VERSAO_BASE }}

      - name: Digest para o .env da VPS
        run: |
          linha="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
          echo "$linha"
          echo "- \`${{ matrix.name }}\`: \`$linha\` (etiqueta ${ETIQUETA}, commit ${GITHUB_SHA::9})" >> "$GITHUB_STEP_SUMMARY"
